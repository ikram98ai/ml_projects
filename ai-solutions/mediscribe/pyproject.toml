[project]
name = "mediscribe"
version = "0.1.0"
description = "Mediscribe is a medical transcription service that uses AI to transcribe medical audio files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.42.4",
    "fastapi[standard]>=0.124.0",
    "google-generativeai>=0.8.5",
    "jinja2>=3.1.6",
    "mangum>=0.19.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pynamodb>=6.1.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
