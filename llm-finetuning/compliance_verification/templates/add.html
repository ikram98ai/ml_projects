<!-- templates/add.html -->
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="/manage" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 transition">
            <i class="fas fa-arrow-left mr-2"></i> Back to documents
        </a>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Add New Document</h1>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6 card">
        <form method="post" enctype="multipart/form-data">
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2" for="source">
                    Source Name
                </label>
                <input type="text" id="source" name="source" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none transition"
                    placeholder="e.g., Legal Guidelines, Product Docs...">
                <p class="text-gray-500 text-sm mt-2">This helps identify the document source</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">
                    Content
                </label>
                <div class="space-y-4">
                    <div>
                        <label class="flex items-center bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-gray-100 transition">
                            <input type="radio" name="inputType" value="text" class="mr-2" checked>
                            <span>Enter Text</span>
                        </label>
                        <div id="textInput" class="mt-3">
                            <textarea name="text" rows="6"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none transition"
                                placeholder="Paste your content here..."></textarea>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-200 pt-4">
                        <label class="flex items-center bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-gray-100 transition">
                            <input type="radio" name="inputType" value="file" class="mr-2">
                            <span>Upload DOCX File</span>
                        </label>
                        <div id="fileInput" class="mt-3 hidden">
                            <div class="flex items-center justify-center w-full">
                                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                        <i class="fas fa-file-word text-blue-500 text-3xl mb-2"></i>
                                        <p class="text-sm text-gray-500">Click to upload DOCX file</p>
                                    </div>
                                    <input type="file" name="file" class="hidden" accept=".docx">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="w-full px-6 py-3.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
                <i class="fas fa-plus mr-2"></i> Add to Knowledge Base
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const textRadio = document.querySelector('input[value="text"]');
        const fileRadio = document.querySelector('input[value="file"]');
        const textInput = document.getElementById('textInput');
        const fileInput = document.getElementById('fileInput');
        
        textRadio.addEventListener('change', () => {
            textInput.style.display = 'block';
            fileInput.style.display = 'none';
        });
        
        fileRadio.addEventListener('change', () => {
            textInput.style.display = 'none';
            fileInput.style.display = 'block';
        });
    });
</script>
{% endblock %}
