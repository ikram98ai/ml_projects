<!-- templates/edit.html -->
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="/manage" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 transition">
            <i class="fas fa-arrow-left mr-2"></i> Back to documents
        </a>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Edit Document</h1>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6 card">
        <form method="post">
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2" for="source">
                    Source
                </label>
                <input type="text" id="source" name="source" value="{{ source }}" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none transition">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2" for="text">
                    Content
                </label>
                <textarea id="text" name="text" rows="8" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none transition">{{ text }}</textarea>
            </div>
            
            <div class="flex gap-3">
                <button type="submit" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
                    <i class="fas fa-save mr-2"></i> Update Document
                </button>
                <a href="/manage" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
