<!-- templates/edit.html -->
{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="mb-8">
        <a href="/manage" class="inline-flex items-center text-indigo-600 hover:text-indigo-700 transition duration-200 ease-in-out text-sm font-medium">
            <i class="fas fa-arrow-left mr-2"></i> Back to Documents
        </a>
        <h1 class="text-3xl font-extrabold text-gray-900 mt-4">Edit Document</h1>
        <p class="text-gray-600 mt-2">Modify the document details below.</p>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
        <form method="post">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="source">
                    Source
                </label>
                <input type="text" id="source" name="source" value="{{ source }}" required
                    class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 ease-in-out">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="text">
                    Content
                </label>
                <textarea id="text" name="text" rows="10" required
                    class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 ease-in-out">{{ text }}</textarea>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-200 ease-in-out transform hover:scale-105">
                    <i class="fas fa-save mr-2"></i> Update Document
                </button>
                <a href="/manage" class="w-full sm:w-auto text-center border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-100 focus:outline-none focus:shadow-outline transition duration-200 ease-in-out">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
